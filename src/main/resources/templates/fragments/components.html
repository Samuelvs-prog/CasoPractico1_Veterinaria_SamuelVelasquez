<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- HEADER -->
<header th:fragment="header" class="site-header text-white py-3">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <div>
            <h1 class="h3 mb-0"><i class="bi bi-heart-pulse-fill me-2"></i><span th:text="#{app.nombre}">Clínica</span></h1>
            <small th:text="#{header.slogan}">Slogan</small>
        </div>
        <div class="small"><i class="bi bi-telephone me-1"></i><span th:text="#{header.contacto}">Contacto</span></div>
    </div>
</header>

<!-- NAVBAR -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-paw-fill"></i></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tipos}" th:text="#{nav.tipos}">Tipos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/servicios}" th:text="#{nav.servicios}">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/citas}" th:text="#{nav.citas}">Citas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#consultas}" th:text="#{nav.consultas}">Consultas</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- FOOTER -->
<footer th:fragment="footer" class="site-footer text-white py-4 mt-4">
    <div class="container text-center">
        <p class="mb-1"><i class="bi bi-geo-alt-fill me-1"></i><span th:text="#{footer.direccion}">Dirección</span>
            &nbsp;|&nbsp; <i class="bi bi-clock me-1"></i><span th:text="#{footer.horario}">Horario</span></p>
        <small th:text="#{footer.derechos}">Derechos</small>
    </div>
</footer>

<!-- TOAST de resultado (RedirectAttributes: mensaje / tipoMensaje) -->
<div th:fragment="toast" class="toast-container position-fixed top-0 end-0 p-3">
    <div th:if="${mensaje != null}" id="toastResultado" class="toast align-items-center border-0 text-white"
         th:classappend="${tipoMensaje == 'error'} ? 'bg-danger' : 'bg-success'" role="alert">
        <div class="d-flex">
            <div class="toast-body" th:text="${mensaje}">Mensaje</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- MODAL de confirmación de eliminación (reutilizable) -->
<div th:fragment="modalEliminar" class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                ¿Está seguro de que desea eliminar <strong id="modalNombre"></strong>? Esta acción no se puede deshacer.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (e) {
            const b = e.relatedTarget;
            document.getElementById('modalNombre').textContent = b.getAttribute('data-nombre');
            document.getElementById('formEliminar').setAttribute('action', b.getAttribute('data-action'));
        });
    </script>
</div>

</body>
</html>
