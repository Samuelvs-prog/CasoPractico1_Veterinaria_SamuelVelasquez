<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Formulario Servicio</title></head>
<body>
<section>
    <div class="card shadow-sm col-lg-7 mx-auto">
        <div class="card-header form-header">
            <h4 class="mb-0" th:text="${servicio.id == null} ? 'Agregar servicio' : 'Editar servicio'">Servicio</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <textarea class="form-control" th:field="*{descripcion}" rows="2" maxlength="255"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="precio">Precio</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="duracionMinutos">Duración (minutos)</label>
                        <input type="number" min="1" class="form-control" th:field="*{duracionMinutos}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="tipo.id">Tipo de servicio</label>
                    <select class="form-select" th:field="*{tipo.id}" required>
                        <option value="">-- Seleccione un tipo --</option>
                        <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-teal"><i class="bi bi-save me-1"></i>Guardar</button>
                <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
