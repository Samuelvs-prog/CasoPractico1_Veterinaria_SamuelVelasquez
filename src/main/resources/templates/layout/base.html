<!DOCTYPE html>
<!-- Plantilla base: todas las vistas la reutilizan con th:replace -->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/components :: header}"></header>
<nav th:replace="~{fragments/components :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <th:block th:replace="${content}"></th:block>
</main>

<footer th:replace="~{fragments/components :: footer}"></footer>
<div th:replace="~{fragments/components :: toast}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const t = document.getElementById('toastResultado');
    if (t) { new bootstrap.Toast(t, { delay: 5000 }).show(); }
</script>
</body>
</html>
