<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Servicios Veterinarios</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title mb-0">Servicios Veterinarios</h2>
        <a th:href="@{/servicios/nuevo}" class="btn btn-teal"><i class="bi bi-plus-lg me-1"></i>Nuevo servicio</a>
    </div>

    <div class="table-responsive shadow-sm rounded-3">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-teal">
            <tr><th>#</th><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Duración</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servicios}">
                <td th:text="${s.id}">1</td>
                <td th:text="${s.nombre}">Nombre</td>
                <td><span class="badge bg-info text-dark" th:text="${s.tipo.nombre}">Tipo</span></td>
                <td th:text="'₡' + ${#numbers.formatDecimal(s.precio, 0, 'COMMA', 2, 'POINT')}">₡0.00</td>
                <td th:text="${s.duracionMinutos} + ' min'">30 min</td>
                <td class="text-end">
                    <a th:href="@{/servicios/{id}/editar(id=${s.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal" data-bs-target="#modalEliminar"
                            th:attr="data-nombre=${s.nombre},data-action=@{/servicios/{id}/eliminar(id=${s.id})}">
                        <i class="bi bi-trash"></i></button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(servicios)}"><td colspan="6" class="text-center text-muted py-4">No hay servicios registrados.</td></tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/components :: modalEliminar}"></div>
</section>
</body>
</html>
