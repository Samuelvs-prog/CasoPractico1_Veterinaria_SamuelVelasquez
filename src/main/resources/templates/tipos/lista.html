<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Tipos de Servicio</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title mb-0">Tipos de Servicio</h2>
        <a th:href="@{/tipos/nuevo}" class="btn btn-teal"><i class="bi bi-plus-lg me-1"></i>Nuevo tipo</a>
    </div>

    <div class="table-responsive shadow-sm rounded-3">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-teal">
            <tr><th>#</th><th>Nombre</th><th>Descripción</th><th class="text-center">Servicios asociados</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tipos}">
                <td th:text="${t.id}">1</td>
                <td th:text="${t.nombre}">Nombre</td>
                <td th:text="${t.descripcion}">Descripción</td>
                <td class="text-center"><span class="badge bg-info text-dark" th:text="${#lists.size(t.servicios)}">0</span></td>
                <td class="text-end">
                    <a th:href="@{/tipos/{id}/editar(id=${t.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal" data-bs-target="#modalEliminar"
                            th:attr="data-nombre=${t.nombre},data-action=@{/tipos/{id}/eliminar(id=${t.id})}">
                        <i class="bi bi-trash"></i></button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tipos)}"><td colspan="5" class="text-center text-muted py-4">No hay tipos registrados.</td></tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/components :: modalEliminar}"></div>
</section>
</body>
</html>
